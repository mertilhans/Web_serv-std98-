# ------------------------------------------------------------------------------
# Intra'da subject ile birlikte verilen resmi tester (tests/tester) icin.
# Subject'in "small tester" bahsettigi arac (bkz. subject s.12). Bu dosya
# SADECE bu testeri calistirmak icindir -- gercek proje demo'su default.conf.
#
# tester'in istedigi setup (tests/tester --help ciktisindan):
#   - Onceden tests/YoupiBanane/ dizini olusturuldu (youpi.bad_extension,
#     youpi.bla, nop/ ve Yeah/ alt dizinleri).
#   - /            SADECE GET
#   - .bla uzantili dosyalar POST ile cgi_tester'i cagirir
#   - /post_body   POST, maxBody 100
#   - /directory/  GET, root = YoupiBanane, dosya belirtilmezse youpi.bad_extension
#
# NOT: cgi_extension yolu bu makineye ozel MUTLAK yol -- baska bir makinede
# calistirirken /mnt/c/Users/Buket/Desktop/webserv_ kismini kendi proje
# kokunuzun mutlak yoluyla degistirin.
# ------------------------------------------------------------------------------

server {
    listen 0.0.0.0:8083;
    root ./www;
    index index.html;

    location / {
        allow_methods GET;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /directory {
        allow_methods GET POST;
        root ./tests/YoupiBanane;
        index youpi.bad_extension;
        cgi_extension .bla /mnt/c/Users/Buket/Desktop/webserv_/tests/cgi_tester;
        client_max_body_size 150M;
    }
}
