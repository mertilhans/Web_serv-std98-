# ------------------------------------------------------------------------------
# HIZLI KULLANIM REHBERI -- HER SUBJECT OZELLIGI ICIN SOMUT ENDPOINT           |
# ------------------------------------------------------------------------------
# ./webserv configs/default.conf ile baslatip asagidakileri deneyebilirsiniz:
#
#   Statik site (GET)            curl http://127.0.0.1:8080/index.html
#   Dizin -> index dosyasi       curl http://127.0.0.1:8080/
#   HTTP redirection (301)       curl -i http://127.0.0.1:8080/old
#   Dosya upload (POST)          curl -X POST --data hi http://127.0.0.1:8080/uploads/test.txt
#   Dosya silme (DELETE)         curl -X DELETE http://127.0.0.1:8080/uploads/test.txt
#   Izin verilmeyen method (405) curl -X DELETE http://127.0.0.1:8080/index.html
#   client_max_body_size (413)   /uploads location'da limit 20M -- asan govde 413 doner
#   CGI (GET)                    curl http://127.0.0.1:8080/cgi-bin/hello.py
#   CGI (POST)                   curl -X POST --data a=1 http://127.0.0.1:8080/cgi-bin/hello.py
#   Ozel error page (404)        curl -i http://127.0.0.1:9091/olmayan-sayfa
#   Autoindex (dizin listeleme)  curl http://127.0.0.1:9091/
#   Wildcard/specific merge      curl -H 'Host: api_local' http://127.0.0.1:9090/
#                                 curl -H 'Host: api_public' http://<makine-ip>:9090/
#   Coklu port dinleme            8080 (main_site), 9090 (api_local/api_public), 9091 (admin_panel)
#   Keep-alive                    curl -v http://127.0.0.1:8080/ http://127.0.0.1:8080/style.css 2>&1 | grep 'Re-using'
#
# CAKISMA/HATA TESTLERI BU DOSYADA DEGIL -- ayri dosyalarda:
#   configs/conflict.conf                              ayni ip:port + ayni server_name -> reddedilmeli
#   configs/vhost_conflict.conf                        ayni bucket icinde server_name cakismasi
#   configs/vhost_scenarios.conf                       gecerli/gecersiz vhost senaryolari (kucuk ornekler)
#   configs/ip_port_servername_cakisma_kurallari.conf  SADECE dokumantasyon (tum cakisma kurallari referansi)
#   tests/feature_test.py                              yukaridaki TUM senaryolari otomatik dogrulayan test paketi
#   tests/crash_test.py                                bozuk/kotu-niyetli istek + crash testleri
#
# ------------------------------------------------------------------------------
# WEBSERV CONFIGURATION REFERENCE  (v2 -- nginx tarzi wildcard/specific merge)  |
# ------------------------------------------------------------------------------

# GENEL KURALLAR
# Sozdizimi: Bloklar '{}' ile ayrilir, komutlar ';' ile biter.
# Dis blok: server{}   Ic blok (server icinde): location{}

# server {}             Yeni bir sunucu blogu / virtual host acar.
# location [/path] {}   Belirli bir URI yolu icin kural blogu acar.
#   Not1: path basinda '/' zorunludur.
#   Not2: NGINX alias mantigi gibi davranir -- location prefix'i URL'den
#         kesilip root ile birlestirilir.
#   Exp:  location /kapouet { root ./www; }  , /kapouet/img1.png -> ./www/img1.png

# Virtual Hosting: Ayni ip:port'u dinleyen birden fazla server blogu olabilir;
# hangisinin cevap verecegi Host header (server_name) ile ayirt edilir.

# Inheritance: server blogundaki genel kurallar (root/index/autoindex/
# client_max_body_size) alt location'lara miras kalir, location kendi
# degerini tanimlarsa onu ezer.

# Prefix Routing: istek URL'siyle EN UZUN eslesen location secilir.

# ------------------------------------------------------------------------------
# LISTEN / OS-LEVEL CONFLICT KURALI  (GUNCEL: nginx merge mantigi)             |
# ------------------------------------------------------------------------------
# Gercek OS davranisi: ayni port numarasinda 0.0.0.0:P (wildcard) ile
# HERHANGI_IP:P (spesifik) AYNI ANDA iki ayri bind()+listen() olarak
# ACILAMAZ -- ikinci bind() EADDRINUSE ile patlar (sira onemsiz).
#
# Biz bunu -- nginx'in yaptigi gibi -- PARSE ASAMASINDA REDDETMIYORUZ,
# bunun yerine MERGE ediyoruz:
#   - Ayni portta wildcard VARSA: o port icin SADECE TEK gercek socket
#     acilir (wildcard'in kendisi, 0.0.0.0:P). Ayni portta yazan spesifik
#     IP'ler (baska server bloklarindan gelse bile) gercek socket almaz,
#     sadece "routing metadata"'sina donusur.
#   - Baglanti kabul edildiginde (accept), getsockname() ile o baglantinin
#     GERCEKTE hangi local IP'ye geldigi ogrenilir (0.0.0.0 degil, gercek
#     hedef IP donuyor). Bu adres, o porttaki spesifik kayitlarla
#     karsilastirilir: tam eslesme varsa o server(lar) kazanir, yoksa
#     wildcard'a dusen server(lar) kullanilir.
#   - Bu adres-bazli secim bittikten SONRA, ayni bucket icinde birden
#     fazla server_name varsa Host header ile asil virtual-host secimi
#     yapilir.
#   - Ayni portta wildcard YOKSA: gorunen her farkli IP kendi gercek
#     socket'ini alir (farkli IP'ler oldugu icin gercek bir OS cakismasi
#     zaten mumkun degildir).
#
# PARSE ZAMANINDA GERCEKTEN REDDEDILEN TEK LISTEN DURUMU:
#   Ayni (ip,port) TAM eslesen iki (veya daha fazla) server, AYNI
#   server_name'e (ikisi de "" dahil) sahipse -> reddedilir. Cunku Host
#   header gelse bile hangisinin cevap verecegi belirsizdir. Farkli
#   server_name'e sahip olmalari, gecerli bir virtual-host senaryosudur.
#
#   Ayrica ayni server blogu kendi icinde AYNI (ip,port)'u iki kez
#   tanimlarsa (anlamsiz tekrar) da reddedilir.
#
# TEK SERVER ICINDE BIRDEN FAZLA LISTEN:
#   Bir server blogunun birden fazla listen satiri olabilir (farkli port,
#   farkli ip, ya da bilerek hem wildcard hem spesifik). Bunlarin hepsi
#   yukaridaki port-bazli merge algoritmasina esit sekilde girer; ayni
#   server'a ait olduklari icin aralarinda asla "hangisi kazanir"
#   belirsizligi olmaz -- ikisi de sonunda o server'a yonlenir.

# ------------------------------------------------------------------------------
# DIGER GECERSIZ / CAKISAN DEGERLER (VALIDATION) -- OZET                      |
# ------------------------------------------------------------------------------
#    - listen portu 1-65535 araliginda olmali (0 ve negatif reddedilir).
#    - listen host'u getaddrinfo ile cozumlenebilir olmali (IPv4 literal,
#      'localhost', veya sistemin /etc/hosts'unda taniyabilecegi bir isim).
#    - Ayni server icinde iki location ayni path'e sahip olamaz.
#    - server_name bir server icinde iki kez tanimlanamaz (duplicate reddedilir).
#    - Global/Location index listesinde tekrar eden dosya adi olamaz.

# ------------------------------------------------------------------------------
# DIREKTIF (DEFAULT & MIRAS)                                                   |
# ------------------------------------------------------------------------------
# SERVER ALTINDA TANIMLANABILEN DIREKTIFLER
# listen               (Tanimsiz ise DEFAULT: listen 0.0.0.0:8080;)
# server_name          (DEFAULT: server_name "";)
# error_page           (DEFAULT: yok, runtime'da yerlesik hata sayfasi uretilir)
# root                 (DEFAULT: root ./www;)
# client_max_body_size (DEFAULT: client_max_body_size 1M;)
# index                (DEFAULT: index index.html;)
# autoindex            (DEFAULT: autoindex off;)
#
# LOCATION ALTINDA MIRAS ALINABILEN DIREKTIFLER (server'dan)
# root, index, autoindex, client_max_body_size
#
# LOCATION ALTINDA TANIMLANABILEN DIREKTIFLER
# allow_methods        (DEFAULT: allow_methods GET;)
# upload_dir           (DEFAULT: yok, upload kapali)
# cgi_extension        (DEFAULT: yok, cgi kapali)
# return                (DEFAULT: yok, yonlendirme kapali)

# ------------------------------------------------------------------------------
# GERCEK ORNEK: BU DOSYADA UC AYRI SENARYO GOSTERILIYOR                        |
# ------------------------------------------------------------------------------

# SENARYO A -- tek server, ayni portta hem wildcard hem spesifik listen.
# Ikisi de ayni server'a ait oldugu icin cakisma degil, sadece iki farkli
# yoldan (herhangi arayuz / sadece loopback) ayni siteye ulasilabilir olur.
server {
    listen 0.0.0.0:8080;
    listen 127.0.0.1:8080;
    server_name main_site;
    root ./www;
    index index.html;

    location / {
        allow_methods GET POST;
        autoindex off;
    }

    # "HTTP redirection" ozelligini somut gostermek icin: /old -> /index.html
    location /old {
        return 301 /index.html;
    }

    # Not: upload_dir kendi tabanidir (root'tan bagimsiz), joinPath location
    # prefix'ini zaten upload_dir'e gore kesiyor -- /uploads/x.txt dogrudan
    # ./www/uploads/x.txt'ye duser, ekstra 'root' gerekmiyor (GET zaten bu
    # location'da izinli degil, root hic kullanilmaz).
    location /uploads {
        allow_methods POST DELETE;
        upload_dir ./www/uploads;
        client_max_body_size 20M;
    }

    # Ayni sebeple: /cgi-bin/hello.py -> ./www/cgi-bin/hello.py
    location /cgi-bin {
        allow_methods GET POST;
        root ./www/cgi-bin;
        cgi_extension .py /usr/bin/python3;
    }
}

# SENARYO B -- iki farkli server, ayni port (9090), biri spesifik biri
# wildcard. Nginx tarzi merge: tek gercek socket (wildcard) acilir,
# 127.0.0.1 uzerinden gelen baglantilar getsockname ile "api_local"a,
# digerleri "api_public"e yonlenir.
server {
    listen 127.0.0.1:9090;
    server_name api_local;
    root ./www/api_local;

    location / {
        allow_methods GET;
    }
}
server {
    listen 0.0.0.0:9090;
    server_name api_public;
    root ./www/api_public;

    location / {
        allow_methods GET;
    }
}

# SENARYO C -- sadece spesifik IP, wildcard yok. Kendi gercek socket'i
# acilir, dogrudan bind edildigi icin ekstra routing gerekmez.
server {
    listen 127.0.0.1:9091;
    server_name admin_panel;
    root ./www/admin;
    autoindex on;

    location / {
        allow_methods GET;
    }

    error_page 404 /errors/404.html;
    error_page 500 502 503 /errors/50x.html;
}
