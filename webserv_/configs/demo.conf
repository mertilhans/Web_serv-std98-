# SENARYO A: TEK server blogu icinde birden fazla listen, biri wildcard biri
# spesifik, AYNI port. Ayni server'a ait olduklari icin cakisma degil --
# ikisi de sonunda ayni server'a yonlenecek.
server {
    listen 0.0.0.0:8080;
    listen 127.0.0.1:8080;
    server_name selfmulti;
    root ./www;
}

# SENARYO B: IKI FARKLI server blogu, AYNI port (9090), biri wildcard
# biri spesifik -- nginx tarzi merge burada devreye giriyor: tek gercek
# socket (wildcard) acilacak, spesifik olan sadece routing metadata.
server {
    listen 127.0.0.1:9090;
    server_name specific_9090;
    root ./www;
}
server {
    listen 0.0.0.0:9090;
    server_name wildcard_9090;
    root ./www;
}

# SENARYO C: sadece spesifik IP, wildcard yok -- kendi gercek socket'ini alir.
server {
    listen 127.0.0.1:9091;
    server_name onlylocal_9091;
    root ./www;
}
