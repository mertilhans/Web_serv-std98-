# Multicast (Class D, 224.0.0.0/4) listen adresi olarak verildi.
# Kernel bind() buna RTN_MULTICAST istisnasiyla izin verir, ama TCP
# connect() multicast hedeflere prensipte hicbir zaman kurulamaz (multicast
# sadece UDP tarzi baglantisiz "bire-cok" dagitim icin anlamli). ConfigParser
# seviyesinde reddediliyor. Beklenen sonuc: "Config: 'listen' multicast/
# reserved (Class D/E) address not allowed" hatasiyla parse basarisiz olmali.
server {
    listen 230.0.0.1:8080;
    root ./www;
}
