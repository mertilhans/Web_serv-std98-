# ==============================================================================
# IP:PORT + SERVER_NAME CAKISMA KURALLARI -- TUM OLASI DURUMLAR (REFERANS)
# ==============================================================================
# Bu dosya SADECE dokumantasyon icindir -- webserv'e verilebilir (tamami
# yorum satiri oldugu icin "0 server block parsed" sonucunu verir, hicbir
# hataya yol acmaz) ama gercek bir test config'i DEGILDIR. Amac: ConfigParser
# ve ListenTable'in birlikte uyguladigi cakisma mantigini, dagitilmis oldugu
# iki dosyadan (ConfigParser.cpp + ListenTable.cpp) tek bir yerde, butun
# senaryolariyla toplu gostermek.
#
# NEREDE HANGI KONTROL YAPILIYOR:
#   1) ConfigParser (parse aninda)  -> TEK bir server'in KENDI ICI tutarliligi
#   2) ListenTable::build() (parse SONRASI) -> TUM server'lar BIRBIRINE GORE
#      kiyaslanir ("topology" kontrolu -- tek server'a bakarak yapilamaz)
#
# ------------------------------------------------------------------------------
# TEMEL KAVRAM: "BUCKET"
# ------------------------------------------------------------------------------
# Her 'listen' direktifi TAM bir (ip, port) ciftine cozulur. TUM server'larin
# TUM listen'leri, ayni (ip, port) cifti altinda gruplanir -- buna "bucket"
# diyoruz. 0.0.0.0:8080 ile 127.0.0.1:8080 birbirinden FARKLI bucket'lardir
# (ip farkli), port ayni olsa bile.
#
#   >>> server_name capismasi SADECE AYNI bucket icinde aranir. <<<
#
# Farkli bucket'larda ayni server_name'i (hatta ikisi de bos "" ismi) kullanmak
# HICBIR ZAMAN capisma degildir -- cunku o (ip,port)'e gelen bir baglanti,
# Host header'a hic bakmadan, SADECE getsockname() ile hangi bucket'ta
# oldugunu zaten biliyor.
#
# ------------------------------------------------------------------------------
# DURUM 1 -- Ayni server blogu, KENDI ICINDE ayni (ip,port)'u iki kez yaziyor
# ------------------------------------------------------------------------------
# server {
#     listen 8080;
#     listen 8080;                <-- anlamsiz tekrar, TAM ayni ip+port
# }
#
# SONUC   : REDDEDILIR
# NEREDE  : ConfigParser::_parseServerDirective ("listen" dali, parse aninda)
# SEBEP   : Ayni server zaten o (ip,port)'u bir kez dinleyecek, ikinci satir
#           hicbir sey katmiyor -- config yazim hatasi kabul edilir.
#
# ------------------------------------------------------------------------------
# DURUM 2 -- Ayni server blogu, FARKLI (ip,port) kombinasyonlari (coklu listen)
# ------------------------------------------------------------------------------
# server {
#     listen 0.0.0.0:8080;
#     listen 127.0.0.1:8080;
#     server_name main_site;
# }
#
# SONUC   : KABUL
# SEBEP   : Iki farkli listen de AYNI server objesine ait -- "hangisi kazanir"
#           belirsizligi hic olusmaz, ikisi de sonunda ayni yere yonlenecek.
#           Runtime'da: 8080 portunda wildcard oldugu icin TEK gercek socket
#           (0.0.0.0:8080) acilir; 127.0.0.1 uzerinden gelen baglanti da
#           getsockname ile bu server'a eslenir (bkz. Durum 8).
#
# ------------------------------------------------------------------------------
# DURUM 3 -- Iki FARKLI server, TAM AYNI (ip,port), AYNI server_name
# ------------------------------------------------------------------------------
# server {
#     listen 0.0.0.0:8080;
#     server_name main_site;
# }
# server {
#     listen 0.0.0.0:8080;        <-- AYNI bucket
#     server_name main_site;      <-- AYNI isim
# }
#
# SONUC   : REDDEDILIR
# NEREDE  : ListenTable::build() Adim 2 (server_name capisma kontrolu)
# SEBEP   : Ayni bucket icinde iki server ayni server_name'e sahip. Host:
#           main_site istegi geldiginde hangisinin cevap verecegi belirsiz.
#
# ------------------------------------------------------------------------------
# DURUM 4 -- Iki FARKLI server, TAM AYNI (ip,port), IKISI DE isimsiz ("")
# ------------------------------------------------------------------------------
# server {
#     listen 0.0.0.0:8080;
#     root ./www;                 <-- server_name YOK -> "" sayilir
# }
# server {
#     listen 0.0.0.0:8080;        <-- AYNI bucket
#     root ./www2;                <-- server_name YOK -> "" sayilir
# }
#
# SONUC   : REDDEDILIR
# NEREDE  : ListenTable::build() Adim 2
# SEBEP   : "" (bos string) de gecerli bir isimdir ve ayni bucket'ta tekrar
#           edemez -- tipki "main_site" gibi. Host header hic gelmese bile
#           hangisi "default server" olacak belirsiz kalir.
#
# ------------------------------------------------------------------------------
# DURUM 5 -- Iki FARKLI server, TAM AYNI (ip,port), FARKLI server_name
# ------------------------------------------------------------------------------
# server {
#     listen 0.0.0.0:8080;
#     server_name tolga1;
# }
# server {
#     listen 0.0.0.0:8080;        <-- AYNI bucket
#     server_name tolga2;         <-- FARKLI isim
# }
#
# SONUC   : KABUL -- klasik virtual hosting senaryosu
# SEBEP   : Ayni bucket'ta olsalar da isimler farkli, Host header ile net
#           ayirt edilebiliyor:
#             Host: tolga1           -> ilk server
#             Host: tolga2           -> ikinci server
#             Host yok / eslesmiyor  -> bucket'taki ILK TANIMLANAN server
#                                       ("default server", nginx'teki gibi --
#                                       burada tolga1 kazanir)
#
# ------------------------------------------------------------------------------
# DURUM 6 -- Iki FARKLI server, AYNI PORT ama FARKLI ip (wildcard + spesifik),
#            AYNI server_name
# ------------------------------------------------------------------------------
# server {
#     listen 0.0.0.0:8081;
#     server_name shared_name;
# }
# server {
#     listen 127.0.0.1:8081;      <-- FARKLI bucket (ip farkli!)
#     server_name shared_name;    <-- isim ayni ama onemli degil
# }
#
# SONUC   : KABUL -- bu bir capisma DEGIL
# SEBEP   : Bucket'lar (0.0.0.0:8081) ile (127.0.0.1:8081) birbirinden FARKLI.
#           server_name tekrari kurali SADECE ayni bucket icinde gecerli.
#           Burada Host header'a bile gerek yok -- getsockname() hangi IP'ye
#           baglanildigini soyleyince doğrudan doğru server'a gidiliyor.
#
# ------------------------------------------------------------------------------
# DURUM 7 -- Iki FARKLI server, AYNI PORT, wildcard + spesifik, IKISI DE
#            isimsiz ("")
# ------------------------------------------------------------------------------
# server { listen 0.0.0.0:8082; }
# server { listen 127.0.0.1:8082; }
#
# SONUC   : KABUL
# SEBEP   : Durum 6 ile birebir ayni mantik -- farkli bucket oldugu icin ""
#           isminin tekrari sorun degil.
#
# ------------------------------------------------------------------------------
# DURUM 8 -- Ayni portta WILDCARD var: gercek socket sayisi (nginx merge)
# ------------------------------------------------------------------------------
# server { listen 127.0.0.1:9090; server_name specific_9090; }
# server { listen 0.0.0.0:9090;   server_name wildcard_9090; }
#
# SONUC   : KABUL, ama runtime davranisi ozel
# NEREDE  : ListenTable::build() Adim 3 (gercek socket karari)
# SEBEP   : Gercek OS davranisi: ayni portta hem 0.0.0.0 hem spesifik bir IP
#           icin AYNI ANDA iki ayri bind()+listen() ACILAMAZ (ikincisi
#           EADDRINUSE ile patlar). Biz bunu nginx gibi PARSE ASAMASINDA
#           REDDETMIYORUZ, MERGE ediyoruz:
#             - Bu port icin SADECE TEK gercek socket acilir: 0.0.0.0:9090
#               (wildcard'in kendisi).
#             - 127.0.0.1:9090 gercek socket ALMAZ, sadece "routing metadata"
#               olarak _buckets icinde kalir.
#             - accept() sonrasi getsockname() ile baglantinin GERCEKTE hangi
#               local IP'ye geldigi ogrenilir (0.0.0.0 degil, gercek IP
#               doner: 127.0.0.1 ya da disaridan gelen bir arayuz IP'si).
#             - Bu adres TAM eslesirse (127.0.0.1) -> specific_9090 kazanir.
#             - Eslesmezse (baska bir arayuzden gelmisse) -> wildcard'a dusen
#               (wildcard_9090) kullanilir.
#
# ------------------------------------------------------------------------------
# DURUM 9 -- Ayni portta wildcard YOK, sadece farkli spesifik IP'ler
# ------------------------------------------------------------------------------
# server { listen 127.0.0.1:9091; server_name onlylocal_9091; }
#
# SONUC   : KABUL, kendi gercek socket'ini alir
# SEBEP   : Wildcard yoksa, gorunen her farkli IP zaten OS seviyesinde
#           birbiriyle cakismaz (farkli IP'lere ayri ayri bind() yapmak
#           sorunsuzdur). Ekstra getsockname yonlendirmesine bile gerek yok.
#
# ------------------------------------------------------------------------------
# OZET KARAR TABLOSU
# ------------------------------------------------------------------------------
# +---------------------------+-------------------+------------------+--------+
# | Ayni (ip,port)?           | server_name esit? | Kimin ici/arasi? | SONUC  |
# +---------------------------+-------------------+------------------+--------+
# | Evet                      | -                 | Ayni server ici  | REDDET |
# | Evet (ayni bucket)        | Evet ("" dahil)   | Farkli server    | REDDET |
# | Evet (ayni bucket)        | Hayir             | Farkli server    | KABUL  |
# | Hayir (farkli bucket/ip)  | Farketmez         | Farkli server    | KABUL  |
# +---------------------------+-------------------+------------------+--------+
#
# ------------------------------------------------------------------------------
# HANGI HATA MESAJI NEREDEN GELIR
# ------------------------------------------------------------------------------
# "server (id=X) ayni listen'i iki kez tanimliyor"        -> ConfigParser (D1)
# "... uzerinde iki server ayni server_name'e (...) sahip" -> ListenTable  (D3, D4)
#
# ------------------------------------------------------------------------------
# NGINX'TEN BILEREK FARKLI OLAN BIR NOKTA
# ------------------------------------------------------------------------------
# nginx'te server_name "_"; ozel bir "catch-all" anlamina gelir (Host header
# hangi degeri tasirsa tasisin bu server'i eslestir). Bizde "_" ozel bir anlam
# TASIMAZ -- HttpUtils::isValidServerName sadece bunun gecerli bir karakter
# kumesi (alnum/./-/_) oldugunu onaylar, runtime'da diger her isim gibi
# LITERAL string karsilastirmasina girer. Bizim "hicbir isimle eslesmezse
# bucket'taki ILK tanimlanan server kazanir" kuralimiz (Durum 5, 8) zaten
# ayni "catch-all" ihtiyacini KARSILIYOR -- sadece "_" yazmaya degil, TANIM
# SIRASINA dayanarak.
