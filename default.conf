# webserv varsayılan config'i -- subject'in IV.3'te istediği tüm directive'leri
# canlı gösterecek şekilde kuruldu (error_page, return, autoindex, upload_path,
# cgi_extension, client_max_body_size, methods, root, index).
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 1000000;

    error_page 404 ./www/404.html;
    error_page 500 ./www/500.html;
    error_page 403 ./www/403.html;

    location / {
        root ./www;
        index index.html;
        methods GET;
        autoindex on;
    }

    # HTTP redirect örneği: /eski -> /
    location /eski {
        return 301 /;
    }

    # Dosya upload örneği: POST ile buraya gönderilen her şey ./www/uploads'a yazılır
    location /upload {
        root ./www;
        upload_path ./www/uploads;
        methods POST DELETE;
    }

    # multiple CGI: aynı script klasörü, iki farklı uzantı/interpreter.
    # Server.cpp'nin findInterpreter() fonksiyonu .py -> python3, .pl -> perl
    # biliyor; hangi extension'lı location'a düşerse cgiHandle onu çalıştırıyor.
    location /cgi-bin {
        root ./www/cgi-bin;
        cgi_extension .py /usr/bin/python3;
        methods GET POST;
    }

    location /cgi-bin-pl {
        root ./www/cgi-bin;
        cgi_extension .pl /usr/bin/perl;
        methods GET POST;
    }
}
