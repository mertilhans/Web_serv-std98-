# Virtual host demo: aynı IP:port'a bağlı iki farklı server_name.
# Host header'ına göre selectServerConfig hangi bloğun cevap vereceğine karar verir.

server {
    listen 127.0.0.1:8080;
    server_name site-a.local;

    location / {
        root ./www/vhost_a;
        index index.html;
        methods GET;
        autoindex off;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name site-b.local;

    location / {
        root ./www/vhost_b;
        index index.html;
        methods GET;
        autoindex off;
    }
}
