# Makinenin gercekten sahip oldugu, arayuze (eth0) atanmis gercek LAN IP'si
# (private, RFC 1918 -- 172.16.0.0/12 blogunda). Ilk oktet 172 < 224
# oldugu icin parser kontrolumuzden hic etkilenmiyor; kernel bunu RTN_LOCAL
# olarak tanidigi icin bind() normal sekilde basarili olur.
server {
    listen 172.26.181.45:8090;
    root ./www;
}
