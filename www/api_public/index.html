<!DOCTYPE html>
<html><head><title>api_public</title></head>
<body style="font-family:sans-serif">
<h1>api_public</h1>
<p>Reached via the wildcard socket on port 9090 (<code>0.0.0.0:9090</code>),
from an interface other than <code>127.0.0.1</code> exactly.</p>
<p>Only ONE real socket is ever opened for this port (the wildcard one) --
<code>api_local</code>'s <code>127.0.0.1</code> entry is routing metadata
only, resolved per-connection via <code>getsockname()</code>.</p>
</body></html>
