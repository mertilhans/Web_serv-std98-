# Class E (240.0.0.0/4, reserved/deneysel) bir adres, makinede sahiplenilmedigi
# icin ConfigParser seviyesinde reddediliyor -- OS bind() de zaten bunu
# EADDRNOTAVAIL ile reddederdi (bkz. RTN_UNICAST, sahiplik kontrolu),
# ama parse'da erken yakalamak daha net bir hata mesaji veriyor.
# Beklenen sonuc: "Config: 'listen' multicast/reserved (Class D/E) address
# not allowed" hatasiyla parse basarisiz olmali.
server {
    listen 250.1.2.3:8080;
    root ./www;
}
