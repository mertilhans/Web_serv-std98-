# SENARYO 1: Ayni wildcard (0.0.0.0:8080), FARKLI server_name -> GECERLI virtual host.
server {
    listen 0.0.0.0:8080;
    server_name tolga1;
    root ./www1;
}
server {
    listen 0.0.0.0:8080;
    server_name tolga2;
    root ./www2;
}
server {
    listen 0.0.0.0:8080;
    server_name tolga3;
    root ./www3;
}

# SENARYO 2: Ayni wildcard (0.0.0.0:8081), wildcard+specific ayni server_name.
# Bucket'lar FARKLI (0.0.0.0 vs 127.0.0.1) oldugu icin bu bir cakisma DEGIL --
# getsockname zaten IP'ye gore ayirdigi icin Host header'a hic gerek kalmadan
# hangi server'in devreye girecegi belli.
server {
    listen 0.0.0.0:8081;
    server_name shared_name;
    root ./wwwA;
}
server {
    listen 127.0.0.1:8081;
    server_name shared_name;
    root ./wwwB;
}

# SENARYO 3: isimsiz (server_name verilmemis, ikisi de "") + wildcard/specific.
# Bucket'lar farkli oldugu icin yine cakisma degil.
server {
    listen 0.0.0.0:8082;
    root ./wwwC;
}
server {
    listen 127.0.0.1:8082;
    root ./wwwD;
}
