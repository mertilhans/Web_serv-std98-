# 127.255.255.255 -- 127.0.0.0/8'in (loopback ag) subnet broadcast adresi.
# KASITLI OLARAK reddedilmiyor: ilk oktet (127) bizim ConfigParser
# kontrolumuzun esigi olan 224'un altinda kaldigi icin parse basarili olur.
# Kernel bind() de buna RTN_BROADCAST istisnasiyla izin verir (subject'in
# izin verdigi fonksiyonlarla -- getifaddrs/ioctl olmadan -- bir arayuzun
# gercek netmask'ini ogrenmenin yolu yok, dolayisiyla "bu IP kendi
# subnetinin broadcast'i mi" sorusu genel olarak config'ten hesaplanamaz).
# Bu dosya, "subnet broadcast tespiti prensipte imkansizdir" savini
# kanitlamak icin BILEREK basarili kalan bir ornek olarak tutuluyor.
server {
    listen 127.255.255.255:8080;
    root ./www;
}
