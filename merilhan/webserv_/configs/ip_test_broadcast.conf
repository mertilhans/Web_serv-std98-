# Limited broadcast (255.255.255.255) listen adresi olarak verildi.
# Kernel bind() buna RTN_BROADCAST istisnasiyla izin verir (bkz.
# ip_port_servername_cakisma_kurallari.conf'taki tartismanin disinda,
# bu artik ConfigParser::_parseListenValue seviyesinde REDDEDILIYOR --
# 255.255.255.255 hicbir host'a ait olamayacagi icin (RFC 6890 Class E)
# TCP istemcisi buraya asla connect() edemez, "acik ama erisilemez soket"
# olustururdu. Beklenen sonuc: "Config: 'listen' multicast/reserved
# (Class D/E) address not allowed" hatasiyla parse basarisiz olmali.
server {
    listen 255.255.255.255:8080;
    root ./www;
}
